name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Settings for the throwaway test database and app used by the jobs below.
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
  BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
  BETTER_AUTH_URL: http://localhost:3000
  STORAGE_DRIVER: local
  EMAIL_DRIVER: console

jobs:
  check:
    name: Typecheck, lint, unit + database tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, real database)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_FULL: "1"
      # Dummy Google keys: shows the button so the redirect to Google can be tested.
      GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-dummy-secret
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run airports:import -- --file tests/fixtures/airports.csv
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runner -t ownaplane .
      - run: docker build --target migrate -t ownaplane-migrate .
