# Local Postgres for development without any cloud account:
#   docker compose up -d db
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/ownaplane  (in .env.local)
#   npm run db:migrate && npm run dev
# Run the production container too (reads .env.local):
#   docker compose --profile app up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ownaplane
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    profiles: ["app"]
    build: .
    env_file: .env.local
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ownaplane
      BETTER_AUTH_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db-data:
